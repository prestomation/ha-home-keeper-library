services:
  homeassistant:
    # HA_TAG selects the Home Assistant version. It defaults to `stable`, so e2e,
    # integration and the walkthrough capture keep testing what users actually run.
    # The nightly `ha-beta.yml` workflow sets `beta` — that's the early warning that
    # a breaking change is inbound, roughly four weeks before it reaches users.
    image: ghcr.io/home-assistant/home-assistant:${HA_TAG:-stable}
    ports:
      - "8123:8123"
    volumes:
      - ./ha_config:/config
      # Each component is its own mount, so the real Home Keeper from
      # ci/fetch-home-keeper.sh sits next to the library.
      - ../../custom_components/home_keeper_library:/config/custom_components/home_keeper_library:ro
      - ./.home_keeper/custom_components/home_keeper:/config/custom_components/home_keeper:ro
    environment:
      - TZ=America/New_York
    tmpfs:
      - /tmp
