name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A job that needs more asks for it in its own permissions block.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      # The component tier installs Home Assistant through its test harness, so this
      # Python is at or above the Python floor of Home Assistant. Below it, pip
      # backtracks to an old harness and an old Home Assistant.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: bash ci/install-deps.sh

      - name: Build panel JS
        run: bash ci/build-panel.sh

      - name: Run frontend tests
        run: bash ci/test-frontend.sh

      - name: Run Python unit tests (pure core)
        run: bash ci/test-python-unit.sh

      - name: Run Python component tests (in-process HA harness)
        run: bash ci/test-python-component.sh

      - name: Translation coverage report
        if: always()
        run: python3 ci/i18n-coverage.py --markdown >> "$GITHUB_STEP_SUMMARY"

      - name: Clean node_modules before validation
        run: rm -rf custom_components/home_keeper_library/frontend/node_modules

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

      - name: Run hassfest
        uses: "home-assistant/actions/hassfest@master"
