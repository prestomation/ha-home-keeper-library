name: Integration Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A job that needs more asks for it in its own permissions block.
permissions:
  contents: read

# The Home Keeper tag that ci/fetch-home-keeper.sh clones. The Library tab
# needs the panel tab API, first in Home Keeper 0.30.0.
env:
  HOME_KEEPER_REF: v0.30.0

jobs:
  integration:
    # The stable lane keeps the name `integration`, so a required check still matches.
    name: ${{ matrix.ha == 'stable' && 'integration' || format('integration (HA {0})', matrix.ha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        ha: [stable, oldest]
    steps:
      - uses: actions/checkout@v7

      # HA_TAG is the Docker image tag. The oldest lane reads ci/oldest-ha.env.
      - name: Choose the Home Assistant version
        run: |
          if [ "${{ matrix.ha }}" = "oldest" ]; then
            . ci/oldest-ha.env
            echo "HA_TAG=$OLDEST_HA" >> "$GITHUB_ENV"
          else
            echo "HA_TAG=${{ matrix.ha }}" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # NOTE: deliberately NOT installing pytest-homeassistant-custom-component
      # here — it pulls in pytest-socket, which blocks the real HTTP this tier
      # needs. Only the lightweight REST deps are installed.
      - name: Install integration test deps
        run: pip install pytest requests websockets

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: custom_components/home_keeper_library/frontend/package-lock.json

      - name: Install frontend deps
        run: npm ci --prefix custom_components/home_keeper_library/frontend

      - name: Build panel JS
        run: bash ci/build-panel.sh

      - name: Fetch Home Keeper
        # The library needs a real Home Keeper for its tab and loan tasks.
        run: bash ci/fetch-home-keeper.sh

      - name: Start Home Assistant
        working-directory: tests/integration
        run: docker compose up -d

      - name: Wait for Home Assistant to start
        run: |
          echo "Waiting for Home Assistant..."
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8123/api/ 2>/dev/null || true)
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then
              echo "Home Assistant is responding (HTTP $code, attempt $i)"
              exit 0
            fi
            echo "Attempt $i/60 - HTTP $code - waiting..."
            sleep 2
          done
          echo "Home Assistant failed to start within 120s"
          (cd tests/integration && docker compose logs)
          exit 1

      - name: Show the Home Assistant version
        continue-on-error: true
        working-directory: tests/integration
        run: docker compose exec -T homeassistant python -c "from homeassistant.const import __version__; print('HA', __version__)"

      - name: Run integration tests
        run: bash ci/test-python-integration.sh

      - name: Dump Home Assistant logs on failure
        if: failure()
        working-directory: tests/integration
        run: docker compose logs homeassistant

      - name: Cleanup
        if: always()
        working-directory: tests/integration
        run: docker compose down -v
